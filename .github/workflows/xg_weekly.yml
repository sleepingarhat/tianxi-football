name: xg_weekly
# Understat 當季 xG 每週補料（2026-09-26 倉主決定解封）。只寫 data/xg/，唔郁凍結預測、指紋、模型。
on:
  schedule:
    - cron: "17 4 * * 2"   # 逢星期二 04:17 UTC（週末賽果齊後）
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: xg-weekly, cancel-in-progress: false }
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 抓當季 xG
        run: |
          Y=$(date -u +%Y); M=$(date -u +%m)
          S=$([ "$M" -ge 7 ] && echo $Y || echo $((Y-1)))
          python scripts/ingest_xg.py --out data/xg --seasons "$S:$S"
      - name: 提交
        run: |
          git config user.name "tianxi-bot"; git config user.email "bot@tianxi.racing"
          git add data/xg
          git diff --cached --quiet || git commit -m "xg: weekly Understat $(date -u +%F)"
          git push
