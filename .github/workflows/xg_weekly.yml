name: xg_weekly
# Understat 當季 xG 每週補料（2026-09-26 倉主決定解封）。自 2026-09-26 起降為後備：
# 寫入 data/xg_understat/，再由 merge_xg.py 合併；2021/22 季起以 PitchAPI 為正選。唔郁凍結預測、指紋、模型。
# 自動重試：步驟內最多 3 次（相隔 10 分鐘）；星期三 04:17 UTC 再補跑一次（冪等）。
on:
  schedule:
    - cron: "17 4 * * 2"   # 逢星期二 04:17 UTC
    - cron: "17 4 * * 3"   # 補跑
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: xg-data, cancel-in-progress: false }
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 抓當季 xG（後備，最多 3 次）
        id: ing
        run: |
          Y=$(date -u +%Y); M=$(date -u +%m)
          S=$([ "$M" -ge 7 ] && echo $Y || echo $((Y-1)))
          R=fail
          for i in 1 2 3; do
            if python scripts/ingest_xg.py --out data/xg_understat --seasons "$S:$S"; then R=ok; break; fi
            echo "第 $i 次失敗"; [ $i -lt 3 ] && sleep 600
          done
          echo "attempts=$i" >> $GITHUB_OUTPUT; echo "result=$R" >> $GITHUB_OUTPUT
          echo "from=$(date -u -d '8 days ago' +%F)" >> $GITHUB_OUTPUT; echo "to=$(date -u -d 'yesterday' +%F)" >> $GITHUB_OUTPUT
      - name: 合併正式 xG 檔
        if: steps.ing.outputs.result == 'ok'
        run: python scripts/merge_xg.py
      - name: 寫狀態
        if: always()
        run: python scripts/write_status.py xg_understat data/xg_understat "${{ steps.ing.outputs.from }}" "${{ steps.ing.outputs.to }}" "${{ steps.ing.outputs.attempts || 0 }}" "${{ steps.ing.outputs.result || 'fail' }}"
      - name: 提交
        if: always()
        run: |
          git config user.name "tianxi-bot"; git config user.email "bot@tianxi.racing"
          git add data/xg_understat data/xg data/_status
          git diff --cached --quiet || git commit -m "xg: weekly Understat backup $(date -u +%F)"
          git pull --rebase && git push
      - name: 結果
        if: steps.ing.outputs.result != 'ok'
        run: exit 1
