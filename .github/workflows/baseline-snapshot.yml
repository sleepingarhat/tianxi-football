name: baseline-snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '20 19 * * 1'
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Fetch bronze snapshot (Club-Football-Match-Data, MIT)
        run: |
          mkdir -p data
          curl -sL -o data/Matches.csv https://raw.githubusercontent.com/xgabora/Club-Football-Match-Data/main/data/Matches.csv
      - name: Baseline snapshot
        run: python3 scripts/baseline_snapshot.py --matches data/Matches.csv --outdir snapshots
      - name: Commit frozen snapshot
        run: |
          git config user.name "tianxi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add snapshots
          git diff --quiet --cached || git commit -m "chore: refresh baseline snapshot [skip ci]"
          git pull --rebase --autostash || true
          git push
