name: football daily ingest

on:
  schedule:
    # 賽程每 6 小時；賽果每日一次（03:20 UTC，歐洲晚場已完）
    - cron: "20 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      full_results:
        description: "全量重抓賽果（2000 起）"
        required: false
        default: "false"

concurrency:
  group: football-daily
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 賽程（每次都跑）
        run: python3 scripts/ingest_fixtures.py

      - name: 賽果（增量：本季 + 上季）
        if: github.event.inputs.full_results != 'true'
        run: |
          Y=$(date -u +%Y)
          M=$(date -u +%m)
          # 8 月前仍算上一個開季年
          if [ "$M" -lt 08 ]; then START=$((Y-2)); END=$((Y-1)); else START=$((Y-1)); END=$Y; fi
          python3 scripts/ingest_results.py --seasons ${START}:${END}

      - name: 賽果（全量重抓）
        if: github.event.inputs.full_results == 'true'
        run: python3 scripts/ingest_results.py --seasons 2000:$(date -u +%Y)

      - name: 賽前預測凍結（S6）
        run: python3 scripts/predict_fixtures.py

      - name: 自檢
        id: selfcheck
        run: |
          set +e
          python3 scripts/selfcheck.py --json > /tmp/selfcheck.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/selfcheck.json

      - name: 入倉
        run: |
          git config user.name "tianxi-bot"
          git config user.email "bot@tianxi.racing"
          git add -A data
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore(data): 每日採集 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: 自檢失敗開 issue
        if: steps.selfcheck.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const rep = JSON.parse(fs.readFileSync('/tmp/selfcheck.json', 'utf8'));
            const title = '[watchdog] 足球資料管線異常';
            const body = '```json\n' + JSON.stringify(rep, null, 2) + '\n```';
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'watchdog',
            });
            const found = issues.find(i => i.title === title);
            if (found) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: found.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['watchdog'] });
            }
